<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر نوبت مژگان</title>
<meta name="theme-color" content="#FAF7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<style>
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: one-column phone timeline — sticky day header, summary strip, time-ordered entries with free gaps between, fixed add button; bottom sheets for forms. Accent = the magenta pen of her paper notebook. */
:root{
  --paper:#FAF7F9; --surface:#FFFFFF; --ink:#26192A; --muted:#76667A; --line:#E8DDE5;
  --pen:#B3126C; --pen-soft:#F9E4F0; --on-pen:#FFFFFF;
  --ok:#1D7449; --ok-soft:#E1F1E8; --bad:#A3401A; --bad-soft:#F8E6DC; --gap:#8E7D8C;
  --shadow:0 10px 30px rgba(38,25,42,.16);
  --font:'Vazirmatn', Tahoma, 'Segoe UI', 'Noto Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#161116; --surface:#211921; --ink:#F4EBF2; --muted:#AA98A7; --line:#3A2E39;
  --pen:#F26BB0; --pen-soft:#3E1D31; --on-pen:#22101A;
  --ok:#62C792; --ok-soft:#173426; --bad:#F09A70; --bad-soft:#3A2218; --gap:#9D8C9B;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#161116; --surface:#211921; --ink:#F4EBF2; --muted:#AA98A7; --line:#3A2E39;
  --pen:#F26BB0; --pen-soft:#3E1D31; --on-pen:#22101A;
  --ok:#62C792; --ok-soft:#173426; --bad:#F09A70; --bad-soft:#3A2218; --gap:#9D8C9B;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .day{flex:1;min-width:0;text-align:center}
.day .wd{font-size:13px;color:var(--muted)}
.day .dt{font-size:20px;font-weight:800;text-wrap:balance}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;flex:none}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.summary{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.summary b{color:var(--ink);font-weight:700}
.total{font-size:15px}
.total b{color:var(--pen);font-size:17px}

/* timeline */
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:right;width:100%}
.item .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.item .t small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.item .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.line1{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.svc{font-size:13px;background:var(--pen-soft);color:var(--pen);border-radius:6px;padding:1px 8px;font-weight:700}
.who{font-size:15px;overflow-wrap:anywhere}
.who .ph{direction:ltr;unicode-bidi:isolate;color:var(--muted);font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;font-weight:700}
.st-booked .pill{background:var(--pen-soft);color:var(--pen)}
.st-done .pill{background:var(--ok-soft);color:var(--ok)}
.st-cancel .pill,.st-noshow .pill{background:var(--bad-soft);color:var(--bad)}
.st-done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.st-cancel,.st-noshow{background:transparent}
.st-cancel .t,.st-cancel .who,.st-noshow .t,.st-noshow .who{text-decoration:line-through;text-decoration-color:var(--pen);opacity:.65}
.new{font-size:11px;color:var(--ok);font-weight:700}
.clash{font-size:12px;color:var(--bad);font-weight:700}
.gapitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;background:transparent;color:var(--gap);width:100%;text-align:right;font-variant-numeric:tabular-nums}
.gapitem b{color:var(--ink);font-weight:700}
.gapitem .plus{color:var(--pen);font-weight:800;white-space:nowrap}
.empty-note{color:var(--muted);font-size:14px;text-align:center;padding:8px}
.sampletag{font-size:11px;border:1px dashed var(--muted);border-radius:6px;padding:0 6px;color:var(--muted)}

.fab{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:6}
.fab button{pointer-events:auto;width:min(528px,100%);height:56px;border:none;border-radius:16px;background:var(--pen);color:var(--on-pen);font-size:18px;font-weight:800;box-shadow:var(--shadow)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet h2{font-size:18px;margin:0;font-weight:800}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;color:var(--muted);font-weight:500}
.inp{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 12px;width:100%;min-width:0;font-size:17px}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;font-size:13px;direction:ltr;text-align:left}
.ltr{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.hstack{display:flex;gap:8px;align-items:stretch}
.hstack .inp{flex:1}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.wide{width:100%;height:54px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{padding:9px 16px;font-size:15px}
.hint{font-size:13px;border-radius:10px;padding:8px 10px;background:var(--pen-soft);color:var(--ink)}
.hint b{color:var(--pen)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.sect{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sect h3{margin:0;font-size:15px}
.svcrow{display:grid;grid-template-columns:1fr 54px 54px 96px;gap:6px}
.svcrow .inp{height:42px;font-size:15px}
.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:0 auto;max-width:400px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;text-align:center;z-index:30;font-size:15px}
.warnbar{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-top:10px}
.tab{border:none;background:transparent;border-radius:9px;height:38px;font-weight:700;font-size:15px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--pen);box-shadow:0 1px 3px rgba(38,25,42,.12)}
.dayrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dayrow.today{border-color:color-mix(in srgb,var(--pen) 45%,var(--line))}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;background:none;padding:0;text-align:right;width:100%}
.dayhead .dn{font-weight:800;font-size:16px}
.dayhead .dn small{font-weight:500;color:var(--pen);font-size:12px;margin-inline-start:6px}
.dayhead .cnt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.slotlist{display:flex;flex-direction:column;gap:4px}
.slot{display:flex;gap:8px;align-items:baseline;border:none;background:var(--paper);border-radius:8px;padding:6px 8px;text-align:right;width:100%;font-size:14px;min-width:0}
.slot .st{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.slot .sv{color:var(--pen);font-weight:700;flex:none}
.slot .sn{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot.done .st{color:var(--ok)}
.frees{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--gap)}
.freechip{border:1.5px dashed var(--line);background:transparent;border-radius:8px;padding:3px 8px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.freechip:hover,.freechip:focus-visible{border-color:var(--pen);color:var(--pen)}
.full{font-size:13px;color:var(--bad);font-weight:700}
.cal{display:flex;flex-direction:column;gap:4px}
.calnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.calnav b{font-size:15px}
.calnav button{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wdh{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.cday{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:50px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-variant-numeric:tabular-nums;min-width:0}
.cday .n{font-size:17px;font-weight:800;line-height:1.2}
.cday .c{font-size:10px;color:var(--muted);line-height:1.2;min-height:12px}
.cday.past{opacity:.45}
.cday.today{border-color:var(--pen)}
.cday.on{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.cday.on .c{color:var(--on-pen)}
.money{font-size:13px;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.money b{color:var(--ok)}
.dayend{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.dayend h3{margin:0;font-size:15px}
.dayend .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.dayend .r.big{font-size:17px;font-weight:800}
.dayend .r.big span:last-child{color:var(--ok)}
.menu-btns{display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.filebtn{position:relative;overflow:hidden;display:grid;place-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* pilot (SMS experiment): home cards, full-screen pages, rows with one big action */
.pcard{display:flex;flex-direction:column;gap:8px;width:100%;text-align:right;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--pen) 45%,var(--line));border-radius:14px;padding:12px 14px;min-height:64px}
.pcard .pc1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pcard .go{color:var(--pen);white-space:nowrap;font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);border-radius:999px;transition:width .2s}
.bar.ok i{background:var(--ok)}
.panel{position:fixed;inset:0;z-index:15;background:var(--paper);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px)}
.panel .wrap{padding-block:0 40px}
.ptop{position:sticky;top:0;z-index:2;background:var(--paper);padding:12px 16px 10px;margin-inline:-16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ptop .r{display:flex;align-items:center;gap:8px}
.ptop h2{flex:1;margin:0;font-size:18px;font-weight:800}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:right;min-height:64px}
.prow.pend{border-color:var(--pen)}
.prow .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .nm{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.prow .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .note{font-size:12px;color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:1px 8px;align-self:flex-start}
.prow .ph,.panel .ph,.sheet .ph{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.addph{color:var(--pen);font-weight:800;white-space:nowrap}
.sendbtn{min-width:92px;height:52px;border-radius:14px;display:grid;place-items:center;text-decoration:none;font-size:17px;font-weight:800;background:var(--pen);color:var(--on-pen);flex:none}
.askrow{flex-basis:100%;display:flex;gap:8px;align-items:center;font-weight:700}
.askrow .btn{flex:1}
.rpill{font-size:13px;border-radius:999px;padding:4px 12px;background:var(--ok-soft);color:var(--ok);font-weight:700;white-space:nowrap}
.rpill.empty{background:var(--pen-soft);color:var(--pen)}
.psub{margin:10px 0 0;font-size:14px;color:var(--muted)}
.ctlbox{border:1.5px dashed var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:14px}
.ctlbox b{color:var(--ink)}
.big-done{text-align:center;padding:20px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.big-done .ic{font-size:40px;line-height:1}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;text-align:center;line-height:1.4}
.steps span{border-radius:8px;padding:6px 2px;background:var(--line);color:var(--muted)}
.steps span.on{background:var(--pen-soft);color:var(--pen);font-weight:700}
.steps span.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.stbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stbl td,.stbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.stbl th{color:var(--muted);font-weight:500;font-size:12px}
textarea.inp.tpl{direction:rtl;text-align:right;font-size:14px;min-height:150px}
.replies .btn{height:52px}
.btn:disabled{opacity:.45}
.pilottag{font-size:11px;border-radius:6px;padding:0 6px;background:var(--ok-soft);color:var(--ok);font-weight:700}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="fa">
  <header class="top">
    <div class="daynav">
      <button class="iconbtn" id="prevDay" aria-label="روز قبل"><span dir="ltr">→</span></button>
      <div class="day"><div class="wd" id="wd"></div><div class="dt" id="dt"></div></div>
      <button class="iconbtn" id="nextDay" aria-label="روز بعد"><span dir="ltr">←</span></button>
      <button class="iconbtn" id="menuBtn" aria-label="پشتیبان و تنظیمات">☰</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabDay" role="tab">برنامه‌ی روز</button>
      <button class="tab" id="tabWeek" role="tab">۷ روز پیش رو</button>
    </div>
    <div class="row2">
      <button class="chip" id="todayBtn">امروز</button>
      <div class="summary" id="summary"></div>
    </div>
    <div class="warnbar" id="backupWarn" hidden></div>
    <div class="hint" id="installBar" hidden style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>این دفتر را مثل یک اپ روی گوشی نصب کن.</span><button class="btn primary" id="installBtn" style="height:40px">نصب</button></div>
  </header>
  <section class="list" id="pilotHome" hidden></section>
  <main class="list" id="list"></main>
</div>
<div class="fab"><button id="addBtn">+ نوبت جدید</button></div>
<div id="pilotRoot" class="panel" hidden></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* PILOT-CORE START */
// Pilot (controlled SMS experiment): pure logic only — no DOM, no app state, no network.
// tests/pilot.test.mjs evaluates this block on its own (node --test tests/*.test.mjs).
//
// Allocation, so it can be reproduced elsewhere (tools/verify_allocation.py does this in Python):
//  1. eligible = [{key, stratum}] for the draw day; key = normalised name.
//     Sort by key, plain code-unit order (same as Python sorted() for Persian text).
//  2. rng = mulberry32(seed):  a = (a + 0x6D2B79F5) | 0;  t = imul(a ^ a>>>15, 1 | a);
//     t = (t + imul(t ^ t>>>7, 61 | t)) ^ t;  return ((t ^ t>>>14) >>> 0) / 2^32
//  3. Fisher–Yates on the sorted list: for i = n-1 .. 1: j = floor(rng() * (i+1)); swap(i, j)
//  4. picked = first min(batch, n) of the shuffled list.
//  5. For each stratum in STRATA order, take its picked people in shuffled order:
//     first floor(k/2) -> message, next floor(k/2) -> control; if k is odd the last one is
//     message when rng() < 0.5, else control (same rng, continuing).
//  inputHash = FNV-1a 32-bit over "key|stratum" lines joined by "\n" (UTF-16 code units), 8 hex digits.
const PC=(function(){
const FA='۰۱۲۳۴۵۶۷۸۹', AR='٠١٢٣٤٥٦٧٨٩';
const latin=s=>String(s||'').replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>AR.indexOf(d));
function normCustomer(s){
  s=latin(s).trim();
  if(!s) return '';
  const m=s.replace(/[\s\-().]/g,'').match(/(?:\+98|0098|98|0)?9\d{9}/);
  if(m){let d=m[0].replace(/\D/g,'');d=d.slice(-10);return '0'+d}
  if(/[a-zA-Z_@]/.test(s)) return '@'+s.replace(/^@+/,'').replace(/\s+/g,'').toLowerCase();
  let d=s.replace(/\D/g,'');
  if(d.startsWith('0098')) d='0'+d.slice(4);
  else if(d.startsWith('98')&&d.length===12) d='0'+d.slice(2);
  else if(d.length===10&&d.startsWith('9')) d='0'+d;
  return d;
}
// a mobile number SMS can go to, or ''
const normPhone=s=>{const c=normCustomer(s);return /^09\d{9}$/.test(c)?c:''};
const normName=s=>latin(s).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/ة/g,'ه').replace(/[ً-ٰٟـ]/g,'')
  .replace(/[‌‍‎‏ ]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();

/* dates: ISO yyyy-mm-dd strings, day arithmetic in UTC so time zones never shift a day */
const pad=n=>String(n).padStart(2,'0');
const dayNum=iso=>Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5;
const daysBetween=(a,b)=>dayNum(b)-dayNum(a);
const addDaysIso=(iso,n)=>new Date((dayNum(iso)+n)*864e5).toISOString().slice(0,10);
// Jalali -> Gregorian: the standard Borkowski arithmetic (as in jalaali-js), checked day by day against Intl in the tests
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  const gy=jy+621;let leapJ=-14,jp=BREAKS[0],jump=0,n;
  for(let i=1;i<BREAKS.length;i++){const jm=BREAKS[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150, march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  let leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
  return {leap,gy,march};
}
const g2d=(gy,gm,gd)=>div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
function d2g(jdn){
  let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=div(mod(j,1461),4)*5+308, gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1;
  return [div(j,1461)-100100+div(8-gm,6),gm,gd];
}
function jalaliToIso(jy,jm,jd){
  jy=+jy;jm=+jm;jd=+jd;
  if(![jy,jm,jd].every(Number.isInteger)||jy<1300||jy>1500||jm<1||jm>12||jd<1)return '';
  const c=jalCal(jy);
  if(jd>(jm<=6?31:jm<=11?30:c.leap===0?30:29))return '';
  const g=d2g(g2d(c.gy,3,c.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1);
  return g[0]+'-'+pad(g[1])+'-'+pad(g[2]);
}
// "1405/05/17", "۱۴۰۵-۵-۱۷", "2026-08-08", "2026/8/8 00:00" -> ISO, or '' if not a real date
function parseDate(s){
  const m=latin(s).trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T].*)?$/);if(!m)return '';
  const y=+m[1],mo=+m[2],d=+m[3];
  if(y>=1300&&y<1500)return jalaliToIso(y,mo,d);
  if(y<1900||mo<1||mo>12||d<1)return '';
  const iso=y+'-'+pad(mo)+'-'+pad(d);
  return addDaysIso(iso,0)===iso?iso:'';
}

/* CSV */
function parseCsv(text){
  text=String(text||'').replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const delim=[';','\t'].reduce((a,c)=>first.split(c).length>first.split(a).length?c:a,',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==='')q=true;
    else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csvJoin=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');

/* the list file (columns found by name, not position) */
const COLS={row:'ردیف',name:'نام مشتری',shamsi:'آخرین مراجعه (شمسی)',greg:'آخرین مراجعه (میلادی)',visits:'تعداد مراجعه',svc:'خدمت آخر',
  avg:'میانگین فاکتور (تومان)',phone:'شماره تلفن',src:'منبع شماره',future:'نوبت از پیش گرفته؟',note:'یادداشت بازبینی'};
const hk=s=>normName(s).replace(/[\s()؟?:_\-]/g,'');
const SRC_IN={'گوشی':'phone','دفتر':'book','دایرکت':'dm','پیدانشد':'none','phone':'phone','book':'book','dm':'dm','none':'none'};
const YES=/^(بله|آره|اره|دارد|داره|yes|y|true|1|✓)$/i;
const intOf=v=>{const d=latin(v).replace(/[,٬\s]/g,'');return /^\d+(\.\d+)?$/.test(d)?Math.round(+d):NaN};
// Excel stores dates as day numbers since 1899-12-30
const excelSerialToIso=n=>addDaysIso('1899-12-30',Math.floor(n));
const readList=text=>readListRows(parseCsv(text));
// rows: arrays of cell strings (from CSV or .xlsx). The header row may sit below a few title rows;
// a row whose «ردیف» says «نمونه» is the workbook's example and is skipped.
function readListRows(rows){
  const out={people:[],errors:[],dupes:[],missing:[],skippedSample:0,skippedNotes:0};
  const hi=rows.slice(0,15).findIndex(r=>r.some(c=>hk(c)===hk(COLS.name)));
  if(hi<0){out.missing=[COLS.name,COLS.shamsi,COLS.visits];return out}
  const head=rows[hi].map(hk), col={};
  for(const k in COLS){const i=head.indexOf(hk(COLS[k]));if(i>=0)col[k]=i}
  if(col.name==null)out.missing.push(COLS.name);
  if(col.shamsi==null&&col.greg==null)out.missing.push(COLS.shamsi);
  if(col.visits==null)out.missing.push(COLS.visits);
  if(out.missing.length)return out;
  const get=(r,k)=>col[k]==null?'':String(r[col[k]]??'').trim();
  const seen={};
  rows.slice(hi+1).forEach((r,i)=>{
    const line=hi+i+2, name=get(r,'name').replace(/\s+/g,' ');
    if(!name)return;
    if(hk(get(r,'row'))==='نمونه'){out.skippedSample++;return}
    if(/^[\d.,٬\s]+$/.test(latin(name))){out.skippedNotes++;return} // a total/summary line under the table, not a person
    const gv=get(r,'greg');
    const s=parseDate(get(r,'shamsi')), g=/^\d{5}(\.\d+)?$/.test(gv)?excelSerialToIso(+gv):parseDate(gv);
    if(!s&&!g){out.errors.push({line,name,msg:'تاریخ آخرین مراجعه خوانده نشد'});return}
    if(s&&g&&s!==g){out.errors.push({line,name,msg:'تاریخ شمسی و میلادی یکی نیستند'});return}
    const visits=intOf(get(r,'visits'));
    if(!(visits>=1)){out.errors.push({line,name,msg:'تعداد مراجعه عدد نیست'});return}
    const key=normName(name);
    if(seen[key]){out.dupes.push(name);return}
    seen[key]=1;
    out.people.push({key,name,lastVisit:s||g,visits,lastSvc:get(r,'svc'),avg:intOf(get(r,'avg'))||0,
      phone:normPhone(get(r,'phone')),phoneSrc:SRC_IN[hk(get(r,'src'))]||'',future:YES.test(get(r,'future')),note:get(r,'note')});
  });
  return out;
}

/* .xlsx without a library: read the zip directory, inflate with the browser's DecompressionStream,
   and pull cell text from the first sheet. Returns rows of strings like parseCsv. */
const xmlText=s=>s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-f]+);/gi,(m,e)=>({lt:'<',gt:'>',amp:'&',quot:'"',apos:"'"}[e]||String.fromCodePoint(e[1]==='x'||e[1]==='X'?parseInt(e.slice(2),16):+e.slice(1))));
const tTexts=x=>[...x.replace(/<rPh[\s\S]*?<\/rPh>/g,'').matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(m=>xmlText(m[1])).join('');
async function readXlsx(buf){
  const u8=buf instanceof Uint8Array?buf:new Uint8Array(buf), dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength), td=new TextDecoder();
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('not an xlsx file');
  const files={};let p=dv.getUint32(e+16,true);
  for(let i=dv.getUint16(e+10,true);i>0&&dv.getUint32(p,true)===0x02014b50;i--){
    const nl=dv.getUint16(p+28,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))]={method:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
    p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
  }
  const read=async name=>{
    const f=files[name];if(!f)return '';
    const start=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true), data=u8.subarray(start,start+f.size);
    if(f.method===0)return td.decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const ss=[...(await read('xl/sharedStrings.xml')).matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>tTexts(m[1]));
  const rid=((await read('xl/workbook.xml')).match(/<sheet\b[^>]*\br:id="([^"]+)"/)||[])[1];
  const rel=rid&&[...(await read('xl/_rels/workbook.xml.rels')).matchAll(/<Relationship\b[^>]*>/g)].map(m=>m[0]).find(x=>x.includes('Id="'+rid+'"'));
  const target=rel&&(rel.match(/Target="([^"]+)"/)||[])[1];
  const sheet=target?(target.startsWith('/')?target.slice(1):'xl/'+target):Object.keys(files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  const xml=await read(sheet);if(!xml)throw new Error('no sheet');
  const colIdx=ref=>[...ref.replace(/\d+/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
  const rows=[];
  for(const rm of xml.matchAll(/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
    const row=[];
    for(const cm of (rm[1]||'').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const at=cm[1],body=cm[2]||'',r=(at.match(/\br="([A-Z]+)\d+"/)||[])[1],t=(at.match(/\bt="(\w+)"/)||[])[1];
      const v=xmlText((body.match(/<v>([\s\S]*?)<\/v>/)||[])[1]||'');
      const val=t==='s'?(ss[+v]||''):t==='inlineStr'?tTexts(body):v;
      const ci=r?colIdx(r):row.length;while(row.length<ci)row.push('');row[ci]=val;
    }
    rows.push(row);
  }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

/* pilot state (lives in S.pilot) */
const DEFAULT_TEMPLATE='سلام [نام] جان، مژگان هستم از سالن [نام سالن]. از آخرین [خدمت]ت یه مدتی گذشته، خواستم بگم اگه خواستی این هفته وقت دارم. هر روز و ساعتی راحتی بهم بگو. اگه دوست نداری از این پیام‌ها بگیری، فقط بنویس «نه»، دیگه مزاحم نمی‌شم.';
const newPilot=(today,ts)=>({v:1,createdAt:ts,listDate:today,lockedAt:null,
  settings:{salon:'',batch:40,template:DEFAULT_TEMPLATE,templateLockedAt:null},people:{},draws:[],sends:{},log:[]});
const addLog=(p,at,event,person,detail)=>p.log.push({at,event,person:person||'',detail:detail||{}});
const drawnKeys=p=>new Set(p.draws.flatMap(d=>d.picked.map(x=>x.key)));
function armOf(p,key){for(const d of p.draws){const x=d.picked.find(y=>y.key===key);if(x)return x.arm}return ''}
// merge a (re-)imported list. Before lock: add and update, keeping phone/source/flag entered in the app.
// After lock: only move "last visit" forward for people not yet drawn. Drawn people are never touched (I4).
function mergeImport(p,rows,today,ts){
  const drawn=drawnKeys(p), s={rows:rows.length,total:0,added:0,updated:0,skippedNew:0,skippedDrawn:0,withPhone:0,withNote:0};
  for(const r of rows){
    const cur=p.people[r.key];
    if(drawn.has(r.key)){s.skippedDrawn++;continue}
    if(p.lockedAt){
      if(!cur){s.skippedNew++;continue}
      if(r.lastVisit>cur.lastVisit){cur.lastVisit=r.lastVisit;s.updated++}
      continue;
    }
    if(!cur){p.people[r.key]={key:r.key,name:r.name,lastVisit:r.lastVisit,visits:r.visits,lastSvc:r.lastSvc,avg:r.avg,
      phone:r.phone,phoneSrc:r.phoneSrc,future:r.future,note:r.note,noMsg:false,byApp:false,addedAt:ts};s.added++;continue}
    Object.assign(cur,{name:r.name,lastVisit:r.lastVisit,visits:r.visits,lastSvc:r.lastSvc,avg:r.avg,note:r.note});
    if(!cur.byApp){if(r.phone)cur.phone=r.phone;if(r.phoneSrc)cur.phoneSrc=r.phoneSrc;cur.future=r.future}
    s.updated++;
  }
  const all=Object.values(p.people);
  s.total=all.length;s.withPhone=all.filter(x=>x.phone).length;s.withNote=all.filter(x=>x.note).length;
  addLog(p,ts,'import','',Object.assign({today,locked:!!p.lockedAt},s));
  return s;
}
function lockList(p,ts){
  if(p.lockedAt)return;
  p.lockedAt=ts;
  const all=Object.values(p.people);
  addLog(p,ts,'lock','',{people:all.length,withPhone:all.filter(x=>x.phone).length});
}
function setPhone(p,key,ch,ts){
  if(p.lockedAt)throw new Error('list is locked');
  const per=p.people[key];if(!per)throw new Error('unknown person');
  if(ch.phone!==undefined)per.phone=normPhone(ch.phone);
  if(ch.phoneSrc!==undefined)per.phoneSrc=ch.phoneSrc;
  if(ch.future!==undefined)per.future=!!ch.future;
  per.byApp=true;
  addLog(p,ts,'phone',key,{hasPhone:!!per.phone,src:per.phoneSrc,future:per.future});
}
function setNoMsg(p,key,val,ts){
  const per=p.people[key];if(!per||!!per.noMsg===!!val)return;
  per.noMsg=!!val;addLog(p,ts,'nomsg',key,{value:!!val});
}
function removePerson(p,key){
  if(p.lockedAt||drawnKeys(p).has(key)||!p.people[key])return false;
  delete p.people[key];return true;
}

/* eligibility, strata, draw */
const STRATA=['v1_d45','v1_d60','v2_d45','v2_d60'];
const stratumOf=(per,date)=>(per.visits>=2?'v2':'v1')+(daysBetween(per.lastVisit,date)<60?'_d45':'_d60');
// a later visit or a booking in the app, after the list's last visit
const recentInApp=(per,bookings)=>!!per.phone&&bookings.some(b=>b.customer===per.phone&&(b.status==='done'||b.status==='booked')&&b.date>per.lastVisit);
function eligibility(per,date,ctx){
  const no=reason=>({ok:false,reason});
  if(ctx.drawn.has(per.key))return no('drawn');
  if(per.noMsg)return no('nomsg');
  if(per.phoneSrc==='none')return no('notfound');
  if(!per.phone)return no('nophone');
  if(per.future)return no('future');
  if(ctx.listDate&&per.lastVisit>ctx.listDate)return no('came');
  if(recentInApp(per,ctx.bookings))return no('recent');
  const d=daysBetween(per.lastVisit,date);
  if(d<45||d>90)return no('window');
  return {ok:true,reason:''};
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function fnv1a(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')}
function drawBatch(eligible,seed,n){
  const list=eligible.map(x=>({key:x.key,stratum:x.stratum})).sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0);
  const rng=mulberry32(seed>>>0);shuffle(list,rng);
  const out=list.slice(0,Math.max(0,Math.min(n,list.length))).map(x=>({key:x.key,stratum:x.stratum,arm:''}));
  for(const s of STRATA){
    const g=out.filter(x=>x.stratum===s), h=Math.floor(g.length/2);
    g.forEach((x,i)=>{x.arm=i<h?'message':'control'});
    if(g.length%2)g[g.length-1].arm=rng()<0.5?'message':'control';
  }
  return out;
}
function planDraw(p,date,bookings){
  const ctx={bookings,drawn:drawnKeys(p),listDate:p.listDate}, eligible=[], excluded={}, byStratum={};
  STRATA.forEach(s=>byStratum[s]=0);
  for(const key of Object.keys(p.people).sort()){
    const per=p.people[key], e=eligibility(per,date,ctx);
    if(e.ok){const st=stratumOf(per,date);eligible.push({key,stratum:st});byStratum[st]++}
    else excluded[e.reason]=(excluded[e.reason]||0)+1;
  }
  const batch=Math.max(1,Math.floor(Number(p.settings.batch))||40);
  return {date,eligible,excluded,byStratum,batch,n:Math.min(batch,eligible.length)};
}
function commitDraw(p,date,seed,bookings,ts){
  if(!p.lockedAt)throw new Error('lock the list first');
  if(p.draws.some(d=>d.date===date))throw new Error('already drawn today');
  seed=Number(seed);
  if(!Number.isInteger(seed)||seed<0||seed>4294967295)throw new Error('bad seed');
  const plan=planDraw(p,date,bookings);
  const inputHash=fnv1a(plan.eligible.map(x=>x.key+'|'+x.stratum).join('\n'));
  const draw={date,seed,n:plan.batch,at:ts,inputHash,eligible:plan.eligible,excluded:plan.excluded,picked:drawBatch(plan.eligible,seed,plan.batch)};
  p.draws.push(draw);
  addLog(p,ts,'draw','',{date,seed,batch:plan.batch,inputHash,excluded:plan.excluded,eligible:plan.eligible,picked:draw.picked});
  return draw;
}

/* the message */
const firstName=n=>String(n||'').trim().replace(/^(خانم|آقای|آقا|دکتر)\s+/,'').split(/\s+/)[0]||'';
const firstService=s=>String(s||'').split(/[+،,\/]/)[0].trim();
const fillTemplate=(tpl,v)=>String(tpl).replace(/\[نام سالن\]/g,v.salon||'').replace(/\[نام\]/g,firstName(v.name||'')).replace(/\[خدمت\]/g,firstService(v.service));
const messageFor=(p,per)=>fillTemplate(p.settings.template||DEFAULT_TEMPLATE,{name:per.name,service:per.lastSvc,salon:p.settings.salon});
const smsHref=(phone,body,ios)=>'sms:'+phone+(ios?'&':'?')+'body='+encodeURIComponent(body);
// what Mojgan's "today's messages" screen gets: the message arm only, controls as a bare count (I1)
function todayView(p,date){
  const d=p.draws.find(x=>x.date===date);
  if(!d)return {date,items:[],controlCount:0,sent:0,total:0};
  const items=d.picked.filter(x=>x.arm==='message').map(x=>{const per=p.people[x.key],s=p.sends[x.key]||{};
    return {key:x.key,name:per.name,phone:per.phone,text:messageFor(p,per),openedAt:s.openedAt||null,sentAt:s.sentAt||null,reply:s.reply||'',replyAt:s.replyAt||null}});
  return {date,items,controlCount:d.picked.length-items.length,sent:items.filter(i=>i.sentAt).length,total:items.length};
}

// earlier sends (draws 1..days ago) so late replies can still be logged; message arm only (I1)
function recentSent(p,today,days){
  const out=[];
  for(const d of p.draws){const age=daysBetween(d.date,today);if(age<1||age>days)continue;
    for(const x of d.picked){const s=p.sends[x.key];if(x.arm==='message'&&s&&s.sentAt)out.push({key:x.key,name:p.people[x.key].name,date:d.date,sentAt:s.sentAt,reply:s.reply||''})}}
  return out.sort((a,b)=>b.sentAt-a.sentAt);
}

/* send log: every change is appended, nothing is deleted (I2) */
const REPLIES=['booked','later','stop','none','failed'];
function sendRec(p,key){
  if(armOf(p,key)!=='message')throw new Error('only the message arm gets a message');
  return p.sends[key]||(p.sends[key]={openedAt:null,opens:0,sentAt:null,reply:'',replyAt:null,history:[]});
}
function recordOpen(p,key,ts){const s=sendRec(p,key);s.openedAt=ts;s.opens++;addLog(p,ts,'open',key)}
function recordSent(p,key,ts){
  const s=sendRec(p,key);if(s.sentAt)return;
  s.history.push({at:ts,field:'sent',from:null,to:ts});s.sentAt=ts;
  if(!p.settings.templateLockedAt)p.settings.templateLockedAt=ts;
  addLog(p,ts,'sent',key);
}
function recordUnsent(p,key,ts){
  const s=sendRec(p,key);if(!s.sentAt)return;
  s.history.push({at:ts,field:'sent',from:s.sentAt,to:null});
  addLog(p,ts,'correct',key,{field:'sent',from:s.sentAt,to:null});s.sentAt=null;
}
function recordReply(p,key,reply,ts){
  if(!REPLIES.includes(reply))throw new Error('unknown reply');
  const s=sendRec(p,key),prev=s.reply||'';if(prev===reply)return;
  s.history.push({at:ts,field:'reply',from:prev||null,to:reply});s.reply=reply;s.replyAt=ts;
  addLog(p,ts,prev?'correct':'reply',key,prev?{field:'reply',from:prev,to:reply}:{reply});
}

/* outcomes: done invoices in days 0..W-1 after the draw; blank (null) until the window has closed */
const PROFIT=0.5525;
function outcomes(per,drawDate,bookings,today){
  const win=W=>{
    if(daysBetween(drawDate,today)<W)return [null,null,null];
    const end=addDaysIso(drawDate,W);
    const bs=bookings.filter(b=>per.phone&&b.customer===per.phone&&b.status==='done'&&b.date>=drawDate&&b.date<end);
    const amt=bs.reduce((a,b)=>a+(Number(b.amount)||0),0);
    return [bs.length,amt,Math.round(amt*PROFIT*100)/100];
  };
  const [n30,amount30,profit30]=win(30),[n60,amount60,profit60]=win(60);
  return {n30,amount30,profit30,n60,amount60,profit60};
}

      <div class="chips" id="fSrc">${SOURCES.map(([k,l])=>`<button class="chip${f.source===k?' on':''}" data-k="${k}">${l}</button>`).join('')}</div>
      <input class="inp" id="fRef" list="refList" placeholder="اسم مانیکوریست یا همکار" value="${esc(f.ref)}" ${f.source==='mani'||f.source==='recep'?'':'hidden'}>
      <datalist id="refList">${refs.map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
    </div>
    <div class="field"><label for="fAmt">مبلغ فاکتور (تومان، کل مبلغ)</label><input class="inp ltr" id="fAmt" inputmode="numeric" autocomplete="off" placeholder="مثلاً 1250000" value="${b&&b.amount?b.amount:''}">

  `,sh=>{
    const dateIn=$('fDate');
    let calStart=satOf(dateIn.value);
    const drawCal=()=>{
      const days=[...Array(21)].map((_,i)=>addDays(calStart,i));
      const m1=faPart(days[0],{month:'long'}), m2=faPart(days[20],{month:'long'}), y=faPart(days[20],{year:'numeric'});
      const cells=days.map(iso=>{const n=dayBookings(iso).filter(x=>active(x)&&(!b||x.id!==b.id)).length;
        return `<button class="cday${iso<t0?' past':''}${iso===t0?' today':''}${iso===dateIn.value?' on':''}" data-d="${iso}" aria-label="${esc(faDay(iso).wd+' '+faDay(iso).dt)}"><span class="n">${faPart(iso,{day:'numeric'})}</span><span class="c">${iso===t0?'امروز':n?fa(n)+' نوبت':''}</span></button>`}).join('');
      $('fCal').innerHTML=`<div class="calnav"><button type="button" data-cal="-21">→ قبلی</button><b>${m1===m2?m1:m1+' – '+m2} ${y}</b><button type="button" data-cal="21">بعدی ←</button></div>
        <div class="calgrid">${['ش','ی','د','س','چ','پ','ج'].map(w=>`<span class="wdh">${w}</span>`).join('')}${cells}</div>`;
    };
    const syncDays=()=>{
      drawCal();const d=faDay(dateIn.value);$('fDateFa').textContent=d.wd+' '+d.dt;
      const gaps=gapsFor(dateIn.value,b&&b.id);
      $('fFrees').innerHTML=gaps.length?'<span>خالی:</span>'+gaps.map(([x,y])=>`<button type="button" class="freechip" data-t="${fromMin(x)}">${faTime(fromMin(x))} تا ${faTime(fromMin(y))}</button>`).join(''):'<span class="full">این روز پر است</span>';
    };
    $('fCal').addEventListener('click',e=>{
      const c=e.target.closest('[data-d]');if(c){dateIn.value=c.dataset.d;syncDays();return}
      const n=e.target.closest('[data-cal]');if(n){calStart=addDays(calStart,Number(n.dataset.cal));drawCal()}
    });
    $('fFrees').addEventListener('click',e=>{const c=e.target.closest('[data-t]');if(c){$('fTime').value=c.dataset.t;toast('ساعت '+fa(c.dataset.t)+' انتخاب شد')}});
    syncDays();
    const svcBox=$('fSvc');
    const syncDur=()=>{const m=durOf(f.services);$('fDur').textContent=m?`مدت: ${fa(m)} دقیقه`:'یک یا چند خدمت را انتخاب کن'};
    svcBox.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{const id=c.dataset.s;const i=f.services.indexOf(id);i>=0?f.services.splice(i,1):f.services.push(id);c.classList.toggle('on',i<0);syncDur()}));
    syncDur();
    const amtIn=$('fAmt');let amtTouched=!!amtIn.value;
    const showAmt=()=>{const v=num(amtIn.value);$('fAmtFa').innerHTML=v?`<span>${money(v)} تومان</span><span>سهم من (${pct()}): <b>${money(myShare(v))}</b></span>${v<10000?'<span class="clash">مبلغ خیلی کم است؛ کل مبلغ را به تومان بنویس.</span>':''}`:''};
    const guessAmt=()=>{if(amtTouched)return;const g=f.services.reduce((a,id)=>a+((svc(id)||{}).price||0),0);amtIn.value=g||'';showAmt()};
    amtIn.addEventListener('input',()=>{amtTouched=!!amtIn.value;showAmt()});showAmt();
    svcBox.addEventListener('click',()=>setTimeout(guessAmt,0));
    sh.querySelectorAll('#fSrc .chip').forEach(c=>c.addEventListener('click',()=>{f.source=c.dataset.k;sh.querySelectorAll('#fSrc .chip').forEach(x=>x.classList.toggle('on',x===c));$('fRef').hidden=!(f.source==='mani'||f.source==='recep')}));
    const custIn=$('fCust');
    let autoName='';
    const showHint=()=>{
      const c=normCustomer(custIn.value);const box=$('fHint');
      if(!c){box.innerHTML='';return}
      if(!c.startsWith('@')&&!/^09\d{9}$/.test(c)){box.innerHTML=c.length>=4?`<div class="hint">${c.length===11?'این شماره موبایل نیست (موبایل با ۰۹ شروع می‌شود).':`شماره ${fa(c.length)} رقمی است؛ موبایل ۱۱ رقم است.`}</div>`:'';return}
      const h=custHistory(c,b&&b.id);const known=S.customers[c];
      const nm=$('fName');
      if(known&&known.name&&(!nm.value||nm.value===autoName)){nm.value=known.name;autoName=known.name}
      else if(!known&&autoName&&nm.value===autoName){nm.value='';autoName=''}
      if(h.length){const l=h[0];box.innerHTML=`<div class="hint"><b>مشتری قبلی</b> · ${fa(h.length)} مراجعه · آخرین: ${faDay(l.date).short} (${esc(l.services.map(svcLabel).join('، '))})</div>`}
      else if(known){box.innerHTML=`<div class="hint">این شماره قبلاً ثبت شده ولی هنوز خدمتی انجام نشده.</div>`}
      else box.innerHTML=`<div class="hint"><b>مشتری جدید</b></div>`;
    };
    custIn.addEventListener('input',showHint);
    custIn.addEventListener('paste',()=>setTimeout(()=>{custIn.value=normCustomer(custIn.value);showHint()},0));
    custIn.addEventListener('blur',()=>{if(custIn.value)custIn.value=normCustomer(custIn.value);showHint()});
    showHint();
    $('fPaste').addEventListener('click',async()=>{
      try{const t=await navigator.clipboard.readText();if(!t)throw 0;custIn.value=normCustomer(t);showHint()}
      catch(e){custIn.focus();toast('انگشت را روی کادر نگه دار و «Paste» را بزن')}
    });
    let noPhoneOk=false;
    custIn.addEventListener('input',()=>{noPhoneOk=false;$('fSave').textContent=b?'ذخیره‌ی تغییرات':'ثبت نوبت'});
    $('fSave').addEventListener('click',()=>{
      const time=$('fTime').value, rawCust=custIn.value.trim(); let cust=normCustomer(rawCust);
      if(!cust&&rawCust&&!$('fName').value.trim()) $('fName').value=rawCust;
      if(!time){toast('ساعت را وارد کن');$('fTime').focus();return}
      if(!f.services.length){toast('خدمت را انتخاب کن');return}
      if(!cust&&!$('fName').value.trim()){toast('شماره یا اسم مشتری را بنویس');custIn.focus();return}
      if(b&&b.status==='done'&&!num(amtIn.value)){toast('این نوبت انجام شده؛ مبلغ فاکتور را بنویس');amtIn.focus();return}
      if(!/^09\d{9}$/.test(cust)&&!noPhoneOk){noPhoneOk=true;$('fSave').textContent='بدون شماره ثبت کن';
        $('fHint').innerHTML=`<div class="hint clash">شماره‌ی موبایل نیست؛ این نوبت به سابقه‌ی پیامک${S.pilot?' و پایلوت':''} وصل نمی‌شود. اگر شماره را نداری، دوباره بزن.</div>`;custIn.focus();return}
      const rec={date:dateIn.value||view,time,customer:cust,name:$('fName').value.trim(),services:f.services,source:f.source,ref:(f.source==='mani'||f.source==='recep')?$('fRef').value.trim():'',amount:num(amtIn.value)||null};
      rec.pct=rec.amount?(b&&b.pct!=null?b.pct:curPct()):null;
      if(cust){S.customers[cust]=Object.assign(S.customers[cust]||{},rec.name?{name:rec.name}:{} ,{seen:Date.now()})}
      if(b){Object.assign(b,rec,{updated:Date.now()})}
      else S.bookings.push(Object.assign({id:uid(),status:'booked',note:'',created:Date.now()},rec));
      save();if(mode==='day')view=rec.date;closeSheet();render();toast(b?'تغییرات ذخیره شد':'نوبت ثبت شد');
    });
  });
}

    ${isPhone?`<div class="grid2"><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="tel:${b.customer}">تماس</a><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="sms:${b.customer}">پیامک</a></div>`:''}

/* backup + settings */
function csv(){
  const head=['id','date_shamsi','date','time','customer','name','services','minutes','source','referrer','status','amount','share_pct','my_share','note','created_at'];
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[...S.bookings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(b=>[
    b.id,shamsi(b.date),b.date,b.time,b.customer,b.name||(S.customers[b.customer]||{}).name||'',
    (b.services||[]).map(svcLabel).join('+'),dur(b),(SOURCES.find(s=>s[0]===b.source)||[,''])[1],b.ref||'',STATUS[b.status],b.amount??'',b.amount?(b.pct!=null?b.pct:curPct()):'',b.amount?shareOf(b):'',b.note||'',new Date(b.created).toISOString()]);
  return [head,...rows].map(r=>r.map(q).join(',')).join('\n');
}
function stamp(){return shamsi(todayIso()).replace(/\//g,'-')}
function backupFile(){return new File([JSON.stringify(S)],`daftar-backup-${stamp()}.json`,{type:'application/json'})}
function csvFile(){return new File(['\ufeff'+csv()],`daftar-${stamp()}.csv`,{type:'text/csv'})}
function download(file){
  const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}
function markBackup(){S.lastBackup=Date.now();save();render()}
async function shareOrDownload(file,label){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:label});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  download(file);toast(label+' در پوشه‌ی Download ذخیره شد');return true;
}
function restoreFrom(text,btn,state){
  let o;try{o=JSON.parse(text);if(!Array.isArray(o.bookings))throw 0}catch(_){toast('فایل یا متن پشتیبان معتبر نیست');return}
  if(!state.armed||state.text!==text){state.armed=true;state.text=text;btn.textContent=`${fa(o.bookings.length)} نوبت جایگزین داده‌های فعلی می‌شود؛ برای تأیید دوباره بزن`;return}
  try{localStorage.setItem(KEY+'-before-restore',JSON.stringify(S))}catch(_){}
  S=PC.restoreState(S,o,DEF_SETTINGS); // an older backup without pilot data keeps this phone's pilot
  save();closeSheet();render();toast('پشتیبان برگردانده شد');
}
async function copyText(txt,ta,label){
  try{await navigator.clipboard.writeText(txt);toast(label+' کپی شد')}
  catch(e){ta.focus();ta.select();toast('متن انتخاب شد؛ «Copy» را بزن')}
}

const canPick=()=>'contacts' in navigator&&navigator.contacts&&typeof navigator.contacts.select==='function';

      ${sameName.length?`<div class="chips">${sameName.map(([c])=>`<button class="chip" data-sug="${c}">در دفتر: <span class="ph">${fa(c)}</span></button>`).join('')}</div>`:''}

    $('pPick')&&$('pPick').addEventListener('click',async()=>{
      try{const c=await navigator.contacts.select(['tel'],{multiple:false});const tel=((c&&c[0]&&c[0].tel)||[]).find(t=>PC.normPhone(t));

    $('pSave').addEventListener('click',()=>{
      const raw=inp.value.trim(),ph=PC.normPhone(raw);
      if(raw&&!ph){toast('شماره‌ی موبایل درست نیست');inp.focus();return}
      const list=findRows(),i=list.findIndex(o=>o.key===key);

      save();closeSheet();
      const next=list.slice(i+1).concat(list.slice(0,Math.max(i,0))).find(o=>o.key!==key&&(findFilter!=='left'||!settled(o)));
      drawPanel();
      const all=Object.values(p.people);toast(`ذخیره شد · ${fa(all.filter(found).length)} از ${fa(all.length)}`);
      if(next)openPerson(next.key);

}

  if(importPreview){

    h+=`<div class="dayend"><b>${esc(importPreview.name)}</b>`+
      (x.fail?'<div class="clash">این فایل خوانده نشد. فایل اکسل (xlsx) یا CSV با UTF-8 بده.</div>':x.missing.length?`<div class="clash">این ستون‌ها پیدا نشد: ${x.missing.map(esc).join('، ')}</div>`:
      `<div class="r"><span>نفر</span><span>${fa(x.people.length)}</span></div><div class="r"><span>با شماره</span><span>${fa(x.people.filter(found).length)}</span></div><div class="r"><span>با یادداشت بازبینی</span><span>${fa(x.people.filter(y=>y.note).length)}</span></div>`)+
      (x.skippedSample?`<div class="small">${fa(x.skippedSample)} ردیف «نمونه» وارد نمی‌شود.</div>`:'')+
      (x.skippedNotes?`<div class="small">${fa(x.skippedNotes)} ردیف جمع/توضیحِ پایین جدول وارد نمی‌شود.</div>`:'')+
      (x.dupes.length?`<div class="clash">اسم تکراری (اول در فایل یکی‌شان را متفاوت کن): ${x.dupes.map(esc).join('، ')}</div>`:'')+
      (x.errors.length?`<div class="clash">${fa(x.errors.length)} ردیف وارد نمی‌شود:</div><div class="hist">${x.errors.slice(0,6).map(e=>`<span>ردیف ${fa(e.line)} (${esc(e.name)}): ${e.msg}</span>`).join('')}</div>`:'')+
      (p&&p.lockedAt?'<div class="small">فهرست قفل است: فقط «آخرین مراجعه»ی کسانی که هنوز قرعه نخورده‌اند به‌روز می‌شود.</div>':'')+
      `<div class="grid2"><button class="btn" id="aImpNo">انصراف</button><button class="btn primary" id="aImpYes"${ok?'':' disabled'}>وارد کن</button></div></div>`;
  }else h+=`<label class="btn filebtn">${p?'ورود دوباره (ادغام)':'انتخاب فایل اکسل یا CSV'}<input type="file" id="aCsv" accept=".xlsx,.csv,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>`;
  h+=`</section>`;
  if(p){
    // 2. numbers
    const all=Object.values(p.people),n=all.filter(found).length;
    h+=`<section class="sect"><h3>۲. پیدا کردن شماره</h3><div class="small">${fa(n)} از ${fa(all.length)} شماره</div>${barHtml(n,all.length)}<button class="btn" data-open="find">${p.lockedAt?'فهرست و برچسب «پیام نده»':'باز کردن فهرست'}</button></section>`;
    // 3. lock
    h+=`<section class="sect"><h3>۳. قفل فهرست</h3>`+(p.lockedAt?`<div class="small">🔒 ${faDay(isoOf(new Date(p.lockedAt))).short} قفل شد. از این به بعد فقط «پیام نده» قابل تغییر است.</div>`:
      `<span class="small">بعد از قفل، ورود نفر تازه و ویرایش شماره بسته می‌شود. قرعه فقط بعد از قفل.</span><button class="btn bad" id="aLock">قفل فهرست…</button>`)+`</section>`;
    // 4. draw
    if(p.lockedAt){
      h+=`<section class="sect"><h3>۴. قرعه‌ی امروز</h3>`;
      if(drewToday)h+=drawSummary(drewToday);
      else h+=`<button class="btn primary" id="aDraw">قرعه‌ی امروز…</button>`;
      const past=p.draws.filter(d=>d!==drewToday).slice().reverse();
      if(past.length)h+=`<div class="hist">${past.map(d=>{const m=d.picked.filter(x=>x.arm==='message'),s=m.filter(x=>(p.sends[x.key]||{}).sentAt).length;return `<span>${faDay(d.date).short}، seed ${fa(d.seed)}، ${fa(d.picked.length)} نفر، ارسال ${fa(s)} از ${fa(m.length)}</span>`}).join('')}</div>`;
      if(p.draws.length)h+=`<button class="btn" data-open="msgs">پیام‌های امروز</button>`;
      h+=`</section>`;
    }
    // exports
    h+=`<section class="sect"><h3>خروجی</h3><span class="small">برای تحلیل با اسکریپت. داده فقط با همین فایل‌ها از گوشی بیرون می‌رود.</span>
      <div class="menu-btns"><button class="btn" id="aExp">خروجی پایلوت (CSV)</button><button class="btn" id="aLog">دفتر آزمایش (CSV)</button></div></section>`;
    // settings
    const locked=!!p.settings.templateLockedAt, any=Object.values(p.people)[0];
    h+=`<section class="sect"><h3>تنظیمات پایلوت</h3>
      <div class="field"><label for="aSalon">نام سالن (در متن پیام)</label><input class="inp" id="aSalon" value="${esc(p.settings.salon)}" autocomplete="off" ${locked?'readonly':''}></div>
      <div class="field"><label for="aBatch">اندازه‌ی دسته‌ی روزانه</label><input class="inp ltr" id="aBatch" inputmode="numeric" value="${fa(p.settings.batch)}"></div>
      <div class="field"><label for="aTpl">متن پیام ${locked?'(بعد از اولین ارسال قفل شد)':'— [نام]، [خدمت] و [نام سالن] پر می‌شوند'}</label><textarea class="inp tpl" id="aTpl" ${locked?'readonly':''}>${esc(p.settings.template)}</textarea></div>
      ${any?`<div class="hint" id="aTplPrev"></div>`:''}
      <button class="btn primary" id="aSave">ذخیره‌ی تنظیمات پایلوت</button></section>`;
  }else h+=`<p class="small">فایل اکسل (xlsx) یا CSV فهرست را انتخاب کن. ستون‌ها با نامشان شناخته می‌شوند: ${Object.values(PC.COLS).map(esc).join('، ')}.</p>`;
  r.innerHTML=`<div class="wrap">${panelHead('پایلوت · مدیریت')}<div class="list">${h}</div></div>`;
  // wiring
  const f=$('aCsv');f&&f.addEventListener('change',async()=>{const file=f.files&&f.files[0];if(!file)return;
    let res;
    try{const buf=new Uint8Array(await file.arrayBuffer());
      res=buf[0]===0x50&&buf[1]===0x4B?PC.readListRows(await PC.readXlsx(buf)):PC.readList(new TextDecoder('utf-8').decode(buf))}
    catch(e){res={people:[],errors:[],dupes:[],missing:[],skippedSample:0,skippedNotes:0,fail:true}}
    importPreview={name:file.name,res};drawPanel()});
  $('aImpNo')&&$('aImpNo').addEventListener('click',()=>{importPreview=null;drawPanel()});
  $('aImpYes')&&$('aImpYes').addEventListener('click',()=>{
    if(!S.pilot){try{if(!localStorage.getItem(KEY+'-before-pilot'))localStorage.setItem(KEY+'-before-pilot',JSON.stringify(S))}catch(_){}S.pilot=PC.newPilot(todayIso(),Date.now())}
    importResult=PC.mergeImport(S.pilot,importPreview.res.people,todayIso(),Date.now());importPreview=null;save();drawPanel();toast('فهرست وارد شد');
  });
  $('aLock')&&$('aLock').addEventListener('click',openLock);
  $('aDraw')&&$('aDraw').addEventListener('click',openDraw);
  $('aExp')&&$('aExp').addEventListener('click',()=>shareOrDownload(new File(['﻿'+PC.pilotCsv(P(),S.bookings,todayIso())],`pilot-${stamp()}.csv`,{type:'text/csv'}),'خروجی پایلوت'));
  $('aLog')&&$('aLog').addEventListener('click',()=>shareOrDownload(new File(['﻿'+PC.logCsv(P())],`pilot-log-${stamp()}.csv`,{type:'text/csv'}),'دفتر آزمایش'));
  const prev=()=>{const b=$('aTplPrev'),any=p&&Object.values(p.people)[0];if(b&&any)b.textContent='نمونه: '+PC.fillTemplate($('aTpl').value,{name:any.name,service:any.lastSvc,salon:$('aSalon').value.trim()})};
  if(p){prev();$('aTpl').addEventListener('input',prev);$('aSalon').addEventListener('input',prev)}
  $('aSave')&&$('aSave').addEventListener('click',()=>{
    const b=num($('aBatch').value);if(!(b>=1&&b<=500)){toast('اندازه‌ی دسته بین ۱ و ۵۰۰');return}
    const tpl=$('aTpl').value.trim();if(!p.settings.templateLockedAt&&!tpl.includes('[نام]')){toast('متن باید [نام] داشته باشد');return}
    p.settings.batch=b;if(!p.settings.templateLockedAt){p.settings.salon=$('aSalon').value.trim();p.settings.template=tpl}
    p.log.push({at:Date.now(),event:'settings',person:'',detail:{salon:p.settings.salon,batch:b,template:p.settings.template}});
    save();drawPanel();toast('تنظیمات پایلوت ذخیره شد');
  });
}
function drawSummary(d){
  const rows=PC.STRATA.map(s=>{const g=d.picked.filter(x=>x.stratum===s);return `<tr><td>${STRATUM_FA[s]}</td><td>${fa(g.filter(x=>x.arm==='message').length)}</td><td>${fa(g.filter(x=>x.arm==='control').length)}</td></tr>`}).join('');
  const m=d.picked.filter(x=>x.arm==='message').length;
  return `<div class="hint">✓ قرعه‌ی امروز زده شد: <b>${fa(m)}</b> پیام · <b>${fa(d.picked.length-m)}</b> مقایسه</div>
    <table class="stbl"><tr><th>طبقه</th><th>پیام</th><th>مقایسه</th></tr>${rows}</table>
    <div class="small">seed ${fa(d.seed)}، ${fa(d.eligible.length)} واجد، شناسه‌ی ورودی <span class="ph">${d.inputHash}</span></div>`;
}
function openLock(){
  const p=P(),all=Object.values(p.people),n=all.filter(found).length,nf=all.filter(x=>!x.phone&&x.phoneSrc==='none').length;
  openSheet(`<div class="sheethead"><h2>قفل فهرست</h2><button class="iconbtn" data-close aria-label="بستن">✕</button></div>
    <div class="dayend"><div class="r"><span>کل فهرست</span><span>${fa(all.length)}</span></div><div class="r"><span>با شماره</span><span>${fa(n)}</span></div>
    <div class="r"><span>پیدا نشد</span><span>${fa(nf)}</span></div><div class="r"><span>هنوز بدون نتیجه</span><span>${fa(all.length-n-nf)}</span></div></div>
    <span class="small">بعد از قفل: نفر تازه اضافه نمی‌شود و شماره‌ها عوض نمی‌شوند. ورود دوباره‌ی فایل فقط «آخرین مراجعه» را به‌روز می‌کند. برگشت‌پذیر نیست.</span>
    <button class="btn bad wide" id="lYes">بله، فهرست را قفل کن</button>`,()=>{
    $('lYes').addEventListener('click',()=>{PC.lockList(p,Date.now());save();closeSheet();drawPanel();toast('فهرست قفل شد 🔒')});
  });
}
function openDraw(){
  const p=P(),t=todayIso(),plan=PC.planDraw(p,t,S.bookings);
  const ex=Object.entries(plan.excluded).sort((a,b)=>b[1]-a[1]);
  const block=!p.settings.salon?'اول «نام سالن» را در تنظیمات پایلوت بنویس.':!plan.eligible.length?'امروز کسی واجد نیست.':'';
  openSheet(`<div class="sheethead"><h2>قرعه‌ی امروز</h2><button class="iconbtn" data-close aria-label="بستن">✕</button></div>
    <div class="small">${faDay(t).wd} ${faDay(t).dt}</div>
    <table class="stbl"><tr><th>طبقه</th><th>واجد امروز</th></tr>${PC.STRATA.map(s=>`<tr><td>${STRATUM_FA[s]}</td><td>${fa(plan.byStratum[s])}</td></tr>`).join('')}<tr><th>جمع</th><th>${fa(plan.eligible.length)}</th></tr></table>
    ${ex.length?`<details><summary>${fa(ex.reduce((a,x)=>a+x[1],0))} نفر کنار گذاشته شدند</summary><div class="hist" style="margin-top:6px">${ex.map(([k,v])=>`<span>${WHY_FA[k]||k}: ${fa(v)}</span>`).join('')}</div></details>`:''}
    <div class="hint">${fa(plan.n)} نفر به قرعه انتخاب می‌شوند؛ در هر طبقه نصف «پیام»، نصف «مقایسه».</div>
    <div class="field"><label for="dSeed">seed (عدد قرعه)</label><div class="hstack"><input class="inp ltr" id="dSeed" inputmode="numeric" value="${randSeed()}"><button class="btn" id="dDice" aria-label="عدد تازه">🎲</button></div></div>
    ${block?`<div class="warnbar" style="margin:0">${block}</div>`:''}
    <button class="btn primary wide" id="dGo"${block?' disabled':''}>تأیید و قرعه</button>`,()=>{
    $('dDice').addEventListener('click',()=>{$('dSeed').value=randSeed()});
    $('dGo').addEventListener('click',()=>{
      const seed=Number(latin($('dSeed').value).trim());
      if(!Number.isInteger(seed)||seed<0||seed>4294967295){toast('seed باید عدد صحیح باشد');return}
      let d;try{d=PC.commitDraw(p,t,seed,S.bookings,Date.now())}catch(e){toast('قرعه زده نشد: '+e.message);return}
      save();closeSheet();drawPanel();const m=d.picked.filter(x=>x.arm==='message').length;toast(`قرعه زده شد: ${fa(m)} پیام · ${fa(d.picked.length-m)} مقایسه`);
    });
  });
}
$('pilotRoot').addEventListener('click',e=>{
  if(e.target.closest('[data-pback]')){panelBack();return}
  const op=e.target.closest('[data-open]');if(op){openPanel(op.dataset.open);return}
  const ff=e.target.closest('[data-ff]');if(ff){findFilter=ff.dataset.ff;drawPanel();return}
  const sd=e.target.closest('[data-send]');if(sd){const key=sd.closest('[data-key]').dataset.key,p=P();PC.recordOpen(p,key,Date.now());p.pending={key,at:Date.now()};save();setTimeout(drawPanel,600);return}
  const y=e.target.closest('[data-yes],[data-no]');if(y){confirmSent(y.closest('[data-key]').dataset.key,y.hasAttribute('data-yes'));return}
  const rp=e.target.closest('[data-reply]');if(rp){openReply(rp.dataset.reply);return}
  const pr=e.target.closest('[data-person]');if(pr)openPerson(pr.dataset.person);
});
$('pilotHome').addEventListener('click',e=>{const c=e.target.closest('[data-pilot]');if(c)openPanel(c.dataset.pilot)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')askPending()});

/* ---------- toast + wiring ---------- */
let tt;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}
const step=()=>mode==='week'?7:1;
$('prevDay').addEventListener('click',()=>{view=addDays(view,-step());render()});
$('nextDay').addEventListener('click',()=>{view=addDays(view,step());render()});
$('tabDay').addEventListener('click',()=>{if(mode!=='day'){mode='day';try{localStorage.setItem(KEY+'-mode','day')}catch(_){}render()}});
$('tabWeek').addEventListener('click',()=>{if(mode!=='week')setMode('week')});
$('todayBtn').addEventListener('click',()=>{view=todayIso();render()});
$('menuBtn').addEventListener('click',openMenu);
$('addBtn').addEventListener('click',()=>openForm({date:mode==='week'?todayIso():view}));
$('list').addEventListener('click',e=>{
  const g=e.target.closest('[data-gap]');if(g){openForm({date:g.dataset.date||view,time:g.dataset.gap});return}
  const dh=e.target.closest('[data-day]');if(dh){view=dh.dataset.day;mode='day';try{localStorage.setItem(KEY+'-mode','day')}catch(_){}render();window.scrollTo(0,0);return}
  const it=e.target.closest('[data-id]');if(it)openActions(it.dataset.id);
});
// swipe between days
let sx=null,sy=null;document.addEventListener('touchstart',e=>{if(!$('sheetRoot').innerHTML&&$('pilotRoot').hidden){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>90&&Math.abs(dy)<50){view=addDays(view,(dx>0?1:-1)*step());render()}},{passive:true});
// F. a new day starts while the app stays open
let renderedToday=todayIso();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const t=todayIso();if(t!==renderedToday){if(view===renderedToday)view=t;renderedToday=t}render()});
// K. install button + L. offline worker
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('installBar').hidden=false});
$('installBtn').addEventListener('click',async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(_){}installEvt=null;$('installBar').hidden=true});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  // a new version took over: reload once, but never while a form is open
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl)return;const go=()=>{if($('sheetRoot').innerHTML){setTimeout(go,3000);return}location.reload()};go()});
}
window.__daftar={normCustomer,shamsi,faDay,csv,state:()=>S,dur,PC};
render();
askPending();
})();
</script>
</body>
